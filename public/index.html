<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Usuarios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Gestión de Usuarios</a>
    </div>
  </nav>

  <div class="container mt-4">

    <h2 class="mb-3">Crear usuario</h2>
    <form id="formUsuario" class="row g-3 align-items-end mb-4">
      <div class="col-12 col-md-5">
        <label class="form-label" for="nombre">Nombre</label>
        <input type="text" class="form-control" id="nombre" name="nombre" required>
      </div>
      <div class="col-12 col-md-4">
        <label class="form-label" for="edad">Edad</label>
        <input type="number" class="form-control" id="edad" name="edad" required>
      </div>
      <div class="col-12 col-md-3">
        <button type="submit" class="btn btn-primary w-100">Enviar</button>
      </div>
    </form>

    <div id="mensaje" class="mb-3"></div>

    <h2 class="mb-3">Usuarios</h2>
    <div id="contenedor-usuarios" class="row g-3"></div>

  </div>

  <script src="app.js"></script>
</body>
</html>
